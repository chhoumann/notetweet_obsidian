name: Dependency Review

# Caller for the shared reusable dependency-review workflow.
#
# NO paths-ignore, so lockfile bumps are always scanned.
on:
    pull_request:
        branches: [master]

permissions:
    contents: read

jobs:
    dependency-review:
        uses: chhoumann/obsidian-plugin-workflows/.github/workflows/dependency-review.yml@d6b3b8c2cf460059238043b32a08dcaa3be4828f # v5.0.0
        permissions:
            contents: read
            pull-requests: write
