name: Dependency Review

# Caller for the shared reusable dependency-review workflow.
#
# NO paths-ignore, so lockfile bumps are always scanned.
on:
    pull_request:
        branches: [master]

permissions:
    contents: read

jobs:
    dependency-review:
        uses: chhoumann/obsidian-plugin-workflows/.github/workflows/dependency-review.yml@149e37801b35c120660a1fd5e78a5471fda55726 # v4.1.0
        permissions:
            contents: read
            pull-requests: write
